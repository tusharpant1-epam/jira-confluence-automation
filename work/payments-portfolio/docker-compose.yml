services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jira_dashboard
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d jira_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
